spring.application.name=parkspot
server.port=8080

# ---------------- MySQL configuration ----------------
# Database name: parkspot   (create it with:  CREATE DATABASE parkspot;)
# createDatabaseIfNotExist=true is only a safety net if you forget to create it.
spring.datasource.url=jdbc:mysql://localhost:3306/parkspot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# ---------------- JPA / Hibernate ----------------
# "update" creates the tables on first run and keeps existing data on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------- Login session ----------------
server.servlet.session.timeout=30m
