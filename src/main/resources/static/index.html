<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSpot - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="navbar"></div>
<main class="container">
    <h1>PARKSPOT</h1>
    <p class="subtitle">Society Visitor Parking Tracker</p>
    <div id="message" class="message"></div>

    <div class="stats">
        <div class="stat"><div class="value" id="totalSlots">-</div><div class="label">Total Slots</div></div>
        <div class="stat"><div class="value" id="availableSlots">-</div><div class="label">Available</div></div>
        <div class="stat"><div class="value" id="occupiedSlots">-</div><div class="label">Occupied</div></div>
        <div class="stat"><div class="value" id="vehiclesInside">-</div><div class="label">Vehicles Inside</div></div>
    </div>

    <div class="card">
        <h2>Parking Slots</h2>
        <div class="slot-grid" id="slotGrid"></div>
    </div>

    <div class="card">
        <h2>Recent Visitors</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Vehicle</th><th>Flat</th><th>Slot</th><th>Entry</th><th>Status</th></tr>
                </thead>
                <tbody id="recentBody"></tbody>
            </table>
        </div>
    </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
